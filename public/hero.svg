<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <!-- Background -->
  <rect width="400" height="320" rx="16" fill="#EEF2FF"/>

  <!-- Decorative blobs -->
  <ellipse cx="360" cy="50" rx="80" ry="80" fill="#818CF8" opacity="0.15"/>
  <ellipse cx="40" cy="280" rx="70" ry="70" fill="#6366F1" opacity="0.12"/>

  <!-- Main card -->
  <rect x="80" y="50" width="240" height="220" rx="16" fill="white" stroke="#E0E7FF" stroke-width="1.5"
        filter="url(#shadow)"/>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366F1" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Card header bar -->
  <rect x="80" y="50" width="240" height="48" rx="16" fill="#6366F1"/>
  <rect x="80" y="78" width="240" height="20" fill="#6366F1"/>

  <!-- Header dots -->
  <circle cx="106" cy="74" r="6" fill="#A5B4FC"/>
  <circle cx="126" cy="74" r="6" fill="#818CF8"/>
  <circle cx="146" cy="74" r="6" fill="white" opacity="0.6"/>
  <text x="200" y="79" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="white" font-weight="600">Task Manager</text>

  <!-- Task rows -->
  <rect x="104" y="118" width="192" height="36" rx="8" fill="#F8FAFF" stroke="#E0E7FF" stroke-width="1"/>
  <rect x="116" y="130" width="12" height="12" rx="3" fill="#6366F1"/>
  <path d="M118 136l2 2 4-4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="136" y="130" width="80" height="5" rx="2.5" fill="#C7D2FE"/>
  <rect x="136" y="140" width="50" height="4" rx="2" fill="#E0E7FF"/>
  <rect x="258" y="128" width="30" height="16" rx="4" fill="#DCFCE7"/>
  <text x="273" y="140" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#16A34A">Done</text>

  <rect x="104" y="162" width="192" height="36" rx="8" fill="#F8FAFF" stroke="#E0E7FF" stroke-width="1"/>
  <rect x="116" y="174" width="12" height="12" rx="3" fill="#E0E7FF" stroke="#C7D2FE" stroke-width="1"/>
  <rect x="136" y="174" width="90" height="5" rx="2.5" fill="#C7D2FE"/>
  <rect x="136" y="184" width="60" height="4" rx="2" fill="#E0E7FF"/>
  <rect x="258" y="172" width="30" height="16" rx="4" fill="#FEF3C7"/>
  <text x="273" y="184" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#D97706">Pending</text>

  <rect x="104" y="206" width="192" height="36" rx="8" fill="#F8FAFF" stroke="#E0E7FF" stroke-width="1"/>
  <rect x="116" y="218" width="12" height="12" rx="3" fill="#E0E7FF" stroke="#C7D2FE" stroke-width="1"/>
  <rect x="136" y="218" width="70" height="5" rx="2.5" fill="#C7D2FE"/>
  <rect x="136" y="228" width="45" height="4" rx="2" fill="#E0E7FF"/>
  <rect x="258" y="216" width="30" height="16" rx="4" fill="#FEE2E2"/>
  <text x="273" y="228" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#DC2626">High</text>

  <!-- Floating badge -->
  <rect x="240" y="35" width="80" height="28" rx="14" fill="#10B981"/>
  <text x="280" y="53" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="white" font-weight="700">✓ 3 Done</text>

  <!-- Floating avatar group -->
  <circle cx="100" cy="295" r="16" fill="#6366F1"/>
  <circle cx="120" cy="295" r="16" fill="#818CF8" stroke="white" stroke-width="2"/>
  <circle cx="140" cy="295" r="16" fill="#A5B4FC" stroke="white" stroke-width="2"/>
  <text x="100" y="299" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="white" font-weight="700">AB</text>
  <text x="120" y="299" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="white" font-weight="700">JD</text>
  <text x="140" y="299" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="white" font-weight="700">+2</text>
  <text x="168" y="299" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6366F1" font-weight="600">Team Tasks</text>
</svg>
